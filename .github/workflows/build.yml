# This workflow handles Nix-based reproducible builds for opensecret
# It requires the configured GitHub-hosted ARM64 larger runner for AWS Nitro
# Enclave compatibility.
name: "Nix Reproducible Builds"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  legacy-pcr-compatibility:
    name: "Legacy PCR Transition Compatibility"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test the pinned legacy verifier
        run: node --test scripts/tests/test_legacy_pcr_compatibility.js

      - name: Enforce append-only legacy histories
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_sha="$(jq -er '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
              ;;
            push)
              base_sha="$(jq -er '.before' "$GITHUB_EVENT_PATH")"
              ;;
            workflow_dispatch)
              echo "Manual run: verifying current histories without a transition base."
              exit 0
              ;;
            *)
              echo "Unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ "$base_sha" =~ ^0+$ ]]; then
            echo "No previous commit exists; current-history tests are sufficient."
            exit 0
          fi
          git cat-file -e "${base_sha}^{commit}"

          while IFS=: read -r environment history_file reference_file; do
            base_history="$RUNNER_TEMP/${history_file}.base.json"
            base_reference="$RUNNER_TEMP/${reference_file}.base.json"
            git show "${base_sha}:${history_file}" > "$base_history"
            git show "${base_sha}:${reference_file}" > "$base_reference"
            node ./pcr_verify.js \
              "$environment" \
              --base-history-file "$base_history"

            base_entries="$(jq -er 'length' "$base_history")"
            candidate_entries="$(jq -er 'length' "$history_file")"
            added_entries=$((candidate_entries - base_entries))
            if (( added_entries > 1 )); then
              echo "$history_file may add at most one released tuple." >&2
              exit 1
            fi
            if (( added_entries == 1 )); then
              if ! cmp -s "$base_reference" "$reference_file"; then
                echo "$reference_file must be merged and released before its legacy history entry." >&2
                exit 1
              fi
              reference_pcr0="$(jq -er '.PCR0' "$reference_file")"
              reference_pcr1="$(jq -er '.PCR1' "$reference_file")"
              reference_pcr2="$(jq -er '.PCR2' "$reference_file")"
              if ! jq -e \
                --arg pcr0 "$reference_pcr0" \
                --arg pcr1 "$reference_pcr1" \
                --arg pcr2 "$reference_pcr2" \
                '.[-1] |
                 .PCR0 == $pcr0 and
                 .PCR1 == $pcr1 and
                 .PCR2 == $pcr2' \
                "$history_file" >/dev/null; then
                echo "The new final $history_file entry must equal $reference_file." >&2
                exit 1
              fi
              node ./pcr_verify.js \
                "$environment" \
                --base-history-file "$base_history" \
                --require-pcr-file "$reference_file"
            fi
          done <<'HISTORIES'
          dev:pcrDevHistory.json:pcrDev.json
          prod:pcrProdHistory.json:pcrProd.json
          HISTORIES

  dev:
    name: "Development Reproducible Build"
    # Run on all PRs and master pushes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'push'
    # Custom runner required: ARM64 architecture needed for AWS Nitro Enclaves
    # 4 cores needed for efficient builds and PCR verification
    runs-on: ubuntu-22.04-arm64-4core
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      # Setup Nix with caching for faster builds
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@bafaa638b9d5ec0e7e3ac1a7fc80453ef1fd265f # v3
      
      - name: Enable FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3

      - name: Check flake.lock health
        uses: DeterminateSystems/flake-checker-action@0af51e37404acfb298f7e2eec77470be27eb57c5 # v10
        with:
          flake-lock-path: flake.lock

      # Build development EIF directly using Nix package
      - name: Build dev EIF
        id: build-dev
        run: |
          set -euo pipefail
          nix build --no-update-lock-file '.?submodules=1#eif-dev'
          git diff --exit-code -- flake.lock
          echo "Build completed successfully"

      # PCR comparison is a master/deployment gate, not a pull-request gate.
      - name: Verify dev PCR
        id: verify-dev
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ ! -f "./pcrDev.json" ]; then
            echo "❌ No pcrDev.json found. This file must be checked into version control."
            exit 1
          fi

          if diff -q "./pcrDev.json" result/pcr.json > /dev/null; then
            echo "✅ Dev PCR values match!"
          else
            echo "❌ Dev PCR values do not match!"
            echo "Expected (./pcrDev.json):"
            cat "./pcrDev.json"
            echo "Got (result/pcr.json):"
            cat result/pcr.json
            exit 1
          fi

          # Existing histories remain valid while a release candidate is built.
          # The exact released tuple is appended only after Sigstore publication.
          node ./pcr_verify.js dev

      # Store artifacts for 7 days
      - name: Upload dev artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-artifacts
          path: result/
          retention-days: 7

  prod:
    name: "Production Reproducible Build"
    # Only run on master pushes or manual triggers for production safety
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    # Same GitHub-hosted ARM64 runner requirements as the dev build
    runs-on: ubuntu-22.04-arm64-4core
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      # Setup Nix with caching for faster builds
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@bafaa638b9d5ec0e7e3ac1a7fc80453ef1fd265f # v3
      
      - name: Enable FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3

      - name: Check flake.lock health
        uses: DeterminateSystems/flake-checker-action@0af51e37404acfb298f7e2eec77470be27eb57c5 # v10
        with:
          flake-lock-path: flake.lock

      # Build production EIF directly using Nix package
      - name: Build prod EIF
        id: build-prod
        run: |
          set -euo pipefail
          nix build --no-update-lock-file '.?submodules=1#eif-prod'
          git diff --exit-code -- flake.lock
          echo "Build completed successfully"

      # PCR comparison is a master/deployment gate, not a pull-request gate.
      - name: Verify prod PCR
        id: verify-prod
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ ! -f "./pcrProd.json" ]; then
            echo "❌ No pcrProd.json found. This file must be checked into version control."
            exit 1
          fi

          if diff -q "./pcrProd.json" result/pcr.json > /dev/null; then
            echo "✅ Production PCR values match!"
          else
            echo "❌ Production PCR values do not match!"
            echo "Expected (./pcrProd.json):"
            cat "./pcrProd.json"
            echo "Got (result/pcr.json):"
            cat result/pcr.json
            exit 1
          fi

          # Existing histories remain valid while a release candidate is built.
          # The exact released tuple is appended only after Sigstore publication.
          node ./pcr_verify.js prod

      # Store production artifacts for 30 days
      - name: Upload prod artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prod-artifacts
          path: result/
          retention-days: 30
