name: Promote Nitro Attestation

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Promote, revoke, or only refresh expiring TUF metadata
        required: true
        type: choice
        options:
          - promote
          - refresh
          - revoke
      version:
        description: Release version without v (required for promote)
        required: false
        type: string
      environment:
        description: Channel to update (used by promote and revoke)
        required: true
        default: prod
        type: choice
        options:
          - prod
          - dev
      phase:
        description: Rollout keeps the previous release; finalize removes it
        required: true
        default: rollout
        type: choice
        options:
          - rollout
          - finalize
      initial_publish:
        description: Bootstrap only; allow no live timestamp before any channel has been activated
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nitro-attestation-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Verify, authorize, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'schedule' && 'attestations-refresh' || 'attestations-production' }}
      url: https://attestations.trymaple.ai/tuf/metadata/timestamp.json
    permissions:
      contents: write
    env:
      OPERATION: ${{ github.event_name == 'schedule' && 'refresh' || inputs.operation }}
      VERSION: ${{ inputs.version || '' }}
      ENVIRONMENT: ${{ inputs.environment || 'prod' }}
      PHASE: ${{ inputs.phase || 'rollout' }}
      INITIAL_PUBLISH: ${{ inputs.initial_publish || false }}
      STATE_BRANCH: attestations-state
      PUBLIC_ORIGIN: https://attestations.trymaple.ai
    steps:
      - name: Require protected master tooling
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master"
          test "$REF_PROTECTED" = "true"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            test "$OPERATION" = "refresh"
            test "$ENVIRONMENT" = "prod"
            test "$INITIAL_PUBLISH" = "false"
          fi
          if [[ "$OPERATION" == "promote" ]]; then
            if [[ ${#VERSION} -gt 128 || ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Promotion version must be MAJOR.MINOR.PATCH within 128 bytes" >&2
              exit 1
            fi
          fi
          if [[ "$INITIAL_PUBLISH" == "true" && "$OPERATION" != "refresh" ]]; then
            echo "initial_publish is only valid for the first metadata refresh" >&2
            exit 1
          fi

      - name: Check out promotion tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
          submodules: false

      - name: Check out public TUF state
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: attestations-state
          path: state
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@bafaa638b9d5ec0e7e3ac1a7fc80453ef1fd265f # v3

      - name: Install Cosign
        if: inputs.operation == 'promote'
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.2

      - name: Verify authenticated state
        shell: bash
        run: |
          set -euo pipefail
          test -d state/tuf/metadata
          test -d state/tuf/targets
          (
            cd tooling
            nix develop --no-update-lock-file --command \
              python scripts/manage_tuf_repository.py verify \
                --repository "$GITHUB_WORKSPACE/state/tuf"
          )

      - name: Download and verify inactive release candidate
        if: inputs.operation == 'promote'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate_tag="v$VERSION"
          candidate_dir="$RUNNER_TEMP/candidate"
          mkdir -p "$candidate_dir"
          gh release download "$candidate_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$candidate_dir" \
            --pattern "opensecret-nitro-$candidate_tag-$ENVIRONMENT.manifest.json" \
            --pattern "opensecret-nitro-$candidate_tag-$ENVIRONMENT.manifest.sigstore.json"

          manifest="$candidate_dir/opensecret-nitro-$candidate_tag-$ENVIRONMENT.manifest.json"
          bundle="$candidate_dir/opensecret-nitro-$candidate_tag-$ENVIRONMENT.manifest.sigstore.json"
          policy="$GITHUB_WORKSPACE/state/tuf/targets/policy/builders.json"
          trusted_root="$GITHUB_WORKSPACE/state/tuf/targets/sigstore/trusted_root.json"
          test -s "$manifest"
          test -s "$bundle"
          test -s "$policy"
          test -s "$trusted_root"

          builder_id="$(jq -er '.build.builderId' "$manifest")"
          identity_regexp="$(jq -er --arg id "$builder_id" '.builders[$id].certificateIdentityRegexp' "$policy")"
          issuer="$(jq -er --arg id "$builder_id" '.builders[$id].certificateOidcIssuer' "$policy")"
          workflow_repository="$(jq -er --arg id "$builder_id" '.builders[$id].workflowRepository' "$policy")"
          workflow_name="$(jq -er --arg id "$builder_id" '.builders[$id].workflowName' "$policy")"
          workflow_trigger="$(jq -er --arg id "$builder_id" '.builders[$id].workflowTrigger' "$policy")"
          source_revision="$(jq -er '.source.revision.digest' "$manifest")"
          test "$(jq -er '.source.revision.algorithm' "$manifest")" = git-sha1
          test "$(jq -er '.source.ref' "$manifest")" = "refs/tags/$candidate_tag"
          test "$(jq -er '.release.version' "$manifest")" = "$VERSION"
          test "$(jq -er '.environment' "$manifest")" = "$ENVIRONMENT"

          remote_revision="$(gh api "repos/$workflow_repository/commits/$candidate_tag" --jq .sha)"
          test "$remote_revision" = "$source_revision"

          cosign verify-blob \
            --bundle "$bundle" \
            --trusted-root "$trusted_root" \
            --certificate-identity-regexp "$identity_regexp" \
            --certificate-oidc-issuer "$issuer" \
            --certificate-github-workflow-name "$workflow_name" \
            --certificate-github-workflow-ref "refs/tags/$candidate_tag" \
            --certificate-github-workflow-repository "$workflow_repository" \
            --certificate-github-workflow-sha "$source_revision" \
            --certificate-github-workflow-trigger "$workflow_trigger" \
            "$manifest"

      - name: Reject public rollback or immutable-history fork
        shell: bash
        run: |
          set -euo pipefail
          command=(
            python scripts/manage_tuf_repository.py verify-live
            --repository "$GITHUB_WORKSPACE/state/tuf"
            --base-url "$PUBLIC_ORIGIN/tuf"
          )
          if [[ "$INITIAL_PUBLISH" == "true" ]]; then
            command+=(--allow-unpublished)
          fi
          (
            cd tooling
            nix develop --no-update-lock-file --command "${command[@]}"
          )

      - name: Create next signed TUF state and static tree
        shell: bash
        env:
          TUF_ONLINE_PRIVATE_KEY_PEM: ${{ secrets.ATTESTATIONS_TUF_ONLINE_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/tuf-online.pem"
          umask 077
          printf '%s' "$TUF_ONLINE_PRIVATE_KEY_PEM" > "$key_file"
          trap 'rm -f "$key_file"' EXIT
          test -s "$key_file"

          command=(
            python scripts/manage_tuf_repository.py
            "$OPERATION"
            --repository "$GITHUB_WORKSPACE/state/tuf"
            --output "$GITHUB_WORKSPACE/tooling/attestations/public/tuf"
            --online-key "$key_file"
          )
          if [[ "$OPERATION" == "promote" ]]; then
            command+=(
              --environment "$ENVIRONMENT"
              --version "$VERSION"
              --phase "$PHASE"
              --manifest "$RUNNER_TEMP/candidate/opensecret-nitro-v$VERSION-$ENVIRONMENT.manifest.json"
              --bundle "$RUNNER_TEMP/candidate/opensecret-nitro-v$VERSION-$ENVIRONMENT.manifest.sigstore.json"
            )
          elif [[ "$OPERATION" == "revoke" ]]; then
            command+=(--environment "$ENVIRONMENT")
          fi
          (
            cd tooling
            nix develop --no-update-lock-file --command "${command[@]}"
          )
          rm -f "$key_file"
          trap - EXIT

      - name: Persist public TUF state without rewriting history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C state status --short
          git -C state add -- tuf
          git -C state diff --cached --quiet && {
            echo "TUF update produced no state change" >&2
            exit 1
          }
          git -C state config user.name github-actions
          git -C state config user.email github-actions@github.com
          release_label="${VERSION:-metadata}"
          git -C state commit -m "Publish TUF $OPERATION $release_label $ENVIRONMENT"
          gh auth setup-git
          git -C state push origin "HEAD:$STATE_BRANCH"

      - name: Install Worker dependencies
        working-directory: tooling
        run: nix develop --no-update-lock-file --command bash -lc 'cd attestations && bun install --frozen-lockfile --ignore-scripts'

      - name: Deploy one atomic Worker version
        working-directory: tooling
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: nix develop --no-update-lock-file --command bash -lc 'cd attestations && bun run deploy'

      - name: Verify every published byte, with timestamp last
        shell: bash
        run: |
          set -euo pipefail
          public_root="$GITHUB_WORKSPACE/tooling/attestations/public"
          require_header() {
            local headers="$1"
            local name="$2"
            local token="$3"
            local value
            value="$(awk -F ':' -v wanted="$name" '
              tolower($1) == wanted {
                sub(/^[^:]*:[[:space:]]*/, "")
                sub(/\r$/, "")
                print tolower($0)
              }
            ' "$headers" | tail -n 1)"
            [[ "$value" == *"$token"* ]]
          }

          verify_cache_headers() {
            local headers="$1"
            local policy="$2"
            if [[ "$policy" == "immutable" ]]; then
              require_header "$headers" cache-control public
              require_header "$headers" cache-control max-age=31536000
              require_header "$headers" cache-control immutable
              require_header "$headers" cache-control no-transform
              require_header "$headers" cdn-cache-control public
              require_header "$headers" cdn-cache-control max-age=31536000
              require_header "$headers" cdn-cache-control immutable
              require_header "$headers" cdn-cache-control no-transform
            else
              require_header "$headers" cache-control no-store
              require_header "$headers" cdn-cache-control no-store
            fi
          }

          verify_byte() {
            local relative="$1"
            local policy="$2"
            local expected="$public_root/$relative"
            local actual
            local headers
            local status
            actual="$RUNNER_TEMP/live-$(printf '%s' "$relative" | tr '/' '-')"
            headers="$actual.headers"
            for _ in 1 2 3 4 5; do
              if status="$(curl --silent --show-error \
                  --max-redirs 0 --proto '=https' --tlsv1.2 \
                  --dump-header "$headers" \
                  --output "$actual" \
                  --write-out '%{http_code}' \
                  "$PUBLIC_ORIGIN/$relative")" \
                && [[ "$status" == "200" ]] \
                && cmp -s "$expected" "$actual" \
                && verify_cache_headers "$headers" "$policy"; then
                return 0
              fi
              sleep 2
            done
            echo "Live status, headers, or bytes differ for $relative" >&2
            return 1
          }

          verify_status_no_store() {
            local relative
            local expected_status
            local stem
            local status
            relative="$1"
            expected_status="$2"
            stem="$RUNNER_TEMP/header-$(printf '%s' "$relative" | tr '/' '-')"
            status="$(curl --silent --show-error \
              --max-redirs 0 --proto '=https' --tlsv1.2 \
              --dump-header "$stem.headers" \
              --output "$stem.body" \
              --write-out '%{http_code}' \
              "$PUBLIC_ORIGIN/$relative")"
            [[ "$status" == "$expected_status" ]]
            verify_cache_headers "$stem.headers" no-store
          }

          while IFS= read -r file; do
            relative="${file#"$public_root/"}"
            [[ "$relative" == "tuf/metadata/timestamp.json" ]] && continue
            verify_byte "$relative" immutable
          done < <(find "$public_root/tuf" -type f -print | LC_ALL=C sort)

          verify_status_no_store health 200
          verify_status_no_store "__attestation-verification-missing-$GITHUB_RUN_ID" 404

          # A timestamp is the client's pointer to all other metadata, so verify it last.
          verify_byte tuf/metadata/timestamp.json no-store
