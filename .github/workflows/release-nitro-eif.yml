name: Nitro EIF Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nitro-eif-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate protected release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_REPOSITORY: OpenSecretCloud/opensecret
      EXPECTED_REPOSITORY_ID: "921901924"
      EXPECTED_OWNER_ID: "185423582"
      REPOSITORY_ID: ${{ github.repository_id }}
      OWNER_ID: ${{ github.repository_owner_id }}
      REF_PROTECTED: ${{ github.ref_protected }}
    steps:
      - name: Check out selected tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Require a protected stable tag on master
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$REPOSITORY_ID" = "$EXPECTED_REPOSITORY_ID"
          test "$OWNER_ID" = "$EXPECTED_OWNER_ID"
          test "$GITHUB_REF_TYPE" = tag
          test "$REF_PROTECTED" = true
          if [[ ${#GITHUB_REF_NAME} -gt 129 || ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin "+refs/heads/master:refs/remotes/origin/master"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          if git submodule status --recursive | grep -Eq '^[+-U]'; then
            echo "Submodules do not match the tagged commits" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.environment }} EIF
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - prod
    runs-on: ubuntu-22.04-arm64-4core
    timeout-minutes: 180
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_URI: https://github.com/${{ github.repository }}
      BUILDER_ID: opensecret-nitro-eif-github-actions
      RUN_URI: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@bafaa638b9d5ec0e7e3ac1a7fc80453ef1fd265f # v3

      - name: Enable FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3

      - name: Build, measure, and describe tagged EIF
        shell: bash
        run: |
          set -euo pipefail
          nix build --no-update-lock-file ".?submodules=1#eif-$ENVIRONMENT"
          git diff --exit-code -- flake.lock
          test -s result/image.eif
          test -s result/pcr.json

          case "$ENVIRONMENT" in
            dev) reference_pcr=pcrDev.json ;;
            prod) reference_pcr=pcrProd.json ;;
          esac
          if ! cmp -s "$reference_pcr" result/pcr.json; then
            echo "$reference_pcr does not describe the tagged EIF" >&2
            diff -u "$reference_pcr" result/pcr.json || true
            exit 1
          fi

          mkdir release-assets
          eif="release-assets/opensecret-$RELEASE_TAG-$ENVIRONMENT.eif"
          pcr="release-assets/opensecret-nitro-$RELEASE_TAG-$ENVIRONMENT.pcr.json"
          manifest="release-assets/opensecret-nitro-$RELEASE_TAG-$ENVIRONMENT.manifest.json"
          install -m 0644 result/image.eif "$eif"
          install -m 0644 result/pcr.json "$pcr"
          python3 scripts/generate_nitro_release_manifest.py generate \
            --environment "$ENVIRONMENT" \
            --commit "$GITHUB_SHA" \
            --tag "$RELEASE_TAG" \
            --source-uri "$SOURCE_URI" \
            --source-path . \
            --builder-id "$BUILDER_ID" \
            --run-uri "$RUN_URI" \
            --pcr "$pcr" \
            --eif "$eif" \
            --flake-lock flake.lock \
            --output "$manifest"

      - name: Upload unsigned candidate inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nitro-eif-${{ matrix.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  sign:
    name: Sign and publish inactive candidate
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-release
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_URI: https://github.com/${{ github.repository }}
      BUILDER_ID: opensecret-nitro-eif-github-actions
      RUN_URI: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
    steps:
      - name: Check out exact tagged signing policy
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download both tagged builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nitro-eif-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
          merge-multiple: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.2

      - name: Revalidate and keylessly sign exact manifests
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-nitro-eif.yml@refs/tags/$RELEASE_TAG"
          for environment in dev prod; do
            eif="release-assets/opensecret-$RELEASE_TAG-$environment.eif"
            pcr="release-assets/opensecret-nitro-$RELEASE_TAG-$environment.pcr.json"
            manifest="release-assets/opensecret-nitro-$RELEASE_TAG-$environment.manifest.json"
            bundle="release-assets/opensecret-nitro-$RELEASE_TAG-$environment.manifest.sigstore.json"
            case "$environment" in
              dev) reference_pcr=pcrDev.json ;;
              prod) reference_pcr=pcrProd.json ;;
            esac
            if ! cmp -s "$reference_pcr" "$pcr"; then
              echo "$pcr does not match tagged $reference_pcr in protected signing" >&2
              diff -u "$reference_pcr" "$pcr" || true
              exit 1
            fi
            python3 scripts/generate_nitro_release_manifest.py verify \
              --environment "$environment" \
              --commit "$GITHUB_SHA" \
              --tag "$RELEASE_TAG" \
              --source-uri "$SOURCE_URI" \
              --source-path . \
              --builder-id "$BUILDER_ID" \
              --run-uri "$RUN_URI" \
              --pcr "$pcr" \
              --eif "$eif" \
              --flake-lock flake.lock \
              --manifest "$manifest"

            cosign sign-blob --yes --bundle "$bundle" "$manifest"
            jq -e '.mediaType == "application/vnd.dev.sigstore.bundle.v0.3+json"' "$bundle" >/dev/null
            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-name "Nitro EIF Release" \
              --certificate-github-workflow-ref "refs/tags/$RELEASE_TAG" \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-sha "$GITHUB_SHA" \
              --certificate-github-workflow-trigger workflow_dispatch \
              "$manifest"
          done

      - name: Publish candidate assets without activating client trust
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_revision="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          test "$remote_revision" = "$GITHUB_SHA"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace an existing candidate release" >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum opensecret-* > "opensecret-nitro-$RELEASE_TAG.sha256"
            sha256sum --check "opensecret-nitro-$RELEASE_TAG.sha256"
          )
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "OpenSecret Nitro EIF $RELEASE_TAG" \
            --notes "Inactive candidate. Only a separate protected TUF promotion at attestations.trymaple.ai authorizes clients to trust it." \
            release-assets/*
