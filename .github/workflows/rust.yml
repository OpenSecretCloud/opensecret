name: Rust CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  format:
    name: Check Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@bafaa638b9d5ec0e7e3ac1a7fc80453ef1fd265f # v3

      - name: Enable FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3

      - name: Check formatting
        env:
          OPENSECRET_DEV_ENV: "0"
          OPENSECRET_DEV_POSTGRES: "0"
        run: nix develop --no-write-lock-file -c cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@bafaa638b9d5ec0e7e3ac1a7fc80453ef1fd265f # v3

      - name: Enable FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3

      - name: Run clippy
        env:
          OPENSECRET_DEV_ENV: "0"
          OPENSECRET_DEV_POSTGRES: "0"
        run: nix develop --no-write-lock-file -c cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@bafaa638b9d5ec0e7e3ac1a7fc80453ef1fd265f # v3

      - name: Enable FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@1f9a51a2959d3e26c7838c6f3bf9f48acae525ea # v3

      - name: Verify pinned stack, migrations, and tests
        env:
          OPENSECRET_DEV_ENV: "0"
          PGDATA: ${{ runner.temp }}/opensecret-pg
          PGPORT: "55432"
        run: |
          nix develop --no-write-lock-file -c bash -euo pipefail -c '
            rustc --version
            openssl version
            postgres --version
            diesel migration run --database-url "$OPENSECRET_DEV_DATABASE_URL"
            cargo test --locked --all-features
            export AEAD_TAMPER_TEST_DATABASE_URL="$OPENSECRET_DEV_DATABASE_URL"
            cargo test --locked --all-features aead_db_tamper_tests:: -- --ignored --test-threads=1
            cargo test --locked --all-features web::oauth_routes::tests::db_oauth_ -- --ignored --test-threads=1
          '
