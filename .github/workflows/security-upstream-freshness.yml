name: Security Upstream Freshness

on:
  schedule:
    # Check daily so security-source updates are not gated on the Nixpkgs cycle.
    - cron: "17 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - flake.lock
      - flake.nix
      - nix/**
      - privatemode-public
      - rust-toolchain.toml
      - scripts/check-security-upstreams.sh
      - .github/workflows/security-upstream-freshness.yml

permissions:
  contents: read

jobs:
  check:
    name: Compare immutable pins with official releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@bafaa638b9d5ec0e7e3ac1a7fc80453ef1fd265f # v3

      - name: Validate security pin structure
        run: bash scripts/check-security-upstreams.sh --offline

      - name: Check live security upstream freshness
        if: github.event_name != 'pull_request'
        env:
          # This step never runs pull-request code and needs only read access.
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/check-security-upstreams.sh --live
